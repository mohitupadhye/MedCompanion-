# Conservative memory settings — added after a native memory allocation crash
# during Gradle sync. If your machine has more RAM available, these numbers
# can be raised later, but starting low and confirming a successful sync
# matters more than starting fast.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.daemon=true
android.useAndroidX=true
